services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["php-fpm", "-F"]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules

    depends_on:
      - worker

  worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--tries=1",
        "--timeout=0"
      ]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.app
    command:
      [
        "npm",
        "run",
        "dev",
        "--",
        "--host=0.0.0.0"
      ]
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
    depends_on:
      - app


  client-torrent:
    build:
      context: ./torrent-client
      dockerfile: Dockerfile
    container_name: torrent-client
    ports:
      - "7881:7881"
    volumes:
      # Same volume as `app`'s storage mount, so a file this service writes
      # at movies/{id}/{filename} lands exactly where
      # Storage::disk('public')->path("movies/{id}/{filename}") expects it
      # inside `app` (storage/app/public/movies/{id}/{filename}) -- see
      # app/Jobs/ConvertMovie.php and app/Http/Controllers/MovieController.php.
      - ./storage/app/public/movies:/var/www/html/storage/app/public/movies
    environment:
      PORT: "7881"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7881/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  vendor:
  node_modules: