services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWW_USER: "${HOST_UID:-1000}"
        WWW_GROUP: "${HOST_GID:-1000}"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    entrypoint: ./docker/entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/hypertube-app-ready"]
      interval: 2s
      timeout: 2s
      retries: 60

  worker-monitoring:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWW_USER: "${HOST_UID:-1000}"
        WWW_GROUP: "${HOST_GID:-1000}"
    volumes:
      - .:/var/www/html
    command:
      - php
      - artisan
      - queue:work
      - monitoring
      - --queue=monitoring
      - --tries=1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker-subtitles:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWW_USER: "${HOST_UID:-1000}"
        WWW_GROUP: "${HOST_GID:-1000}"
    volumes:
      - .:/var/www/html
    command:
      - php
      - artisan
      - queue:work
      - subtitles
      - --queue=subtitles
      - --tries=1
      - --timeout=120
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker-conversions:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWW_USER: "${HOST_UID:-1000}"
        WWW_GROUP: "${HOST_GID:-1000}"
    volumes:
      - .:/var/www/html
    command:
      - php
      - artisan
      - queue:work
      - conversions
      - --queue=conversions
      - --tries=1
      - --timeout=21540
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWW_USER: "${HOST_UID:-1000}"
        WWW_GROUP: "${HOST_GID:-1000}"
    user: root
    volumes:
      - .:/var/www/html
    environment:
      MOVIE_CLEANUP_TIME: "${MOVIE_CLEANUP_TIME:-03:00}"
    entrypoint: ./docker/scheduler-entrypoint.sh
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy

  client-torrent:
    build:
      context: ./torrent-client
      dockerfile: Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    container_name: torrent-client
    ports:
      - "7881:7881"
    volumes:
      - ./storage:/var/www/html/storage

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-hypertube}"
      POSTGRES_USER: "${DB_USERNAME:-hypertube}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-hypertube} -d ${DB_DATABASE:-hypertube}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
