services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["php-fpm", "-F"]
    volumes:
      - .:/var/www/html
    depends_on:
        - worker

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "php",
        "artisan",
        "queue:work",
        "--tries=1",
        "--timeout=0"
      ]
    volumes:
      - .:/var/www/html

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      [
        "npm",
        "run",
        "dev",
        "--",
        "--host=0.0.0.0"
      ]
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    depends_on:
      - app