services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - laravel-storage:/var/www/html/storage
      - laravel-bootstrap:/var/www/html/bootstrap/cache
    environment:
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
    entrypoint: ./docker/entrypoint.sh
    healthcheck:
      test: ["CMD", "php", "artisan", "tinker", "--execute", "echo 'ok'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      client-torrent:
        condition: service_healthy

  client-torrent:
    build:
      context: ./torrent-client
      dockerfile: Dockerfile
    container_name: torrent-client
    ports:
      - "7881:7881"
    volumes:
      # Same volume as `app`'s storage mount, so a file this service writes
      # at movies/{id}/{filename} lands exactly where
      # Storage::disk('public')->path("movies/{id}/{filename}") expects it
      # inside `app` (storage/app/public/movies/{id}/{filename}) -- see
      # app/Jobs/ConvertMovie.php and app/Http/Controllers/MovieController.php.
      - laravel-storage:/var/www/html/storage
    environment:
      PORT: "7881"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7881/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  laravel-storage:
  laravel-bootstrap:

