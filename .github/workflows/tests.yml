name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # composer setup runs the migrations on PostgreSQL, as in Docker. The job runs on the
    # runner, not in a container: the service is reached on 127.0.0.1, not on "postgres".
    # The tests keep the in-memory SQLite of phpunit.xml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hypertube
          POSTGRES_USER: hypertube
          POSTGRES_PASSWORD: hypertube
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hypertube -d hypertube"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup
        # Only this step: real environment variables win over .env (copied from .env.example)
        # and over the <env> of phpunit.xml, so set for the whole job they would send the
        # tests to PostgreSQL too.
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: hypertube
          DB_USERNAME: hypertube
          DB_PASSWORD: hypertube

      # The media tests run the real ffprobe and ffmpeg, as the Docker image does.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run CI Checks
        run: composer ci:check

      - name: Run Client Torrent unit tests
        working-directory: torrent-client
        run: npm run test:unit